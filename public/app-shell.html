<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="RoTaKip ile okuma alışkanlıklarınızı ve grup ilerlemenizi takip edin; tesbihat, tefekkür, videolar ve makaleler gibi içeriklere tek yerden ulaşın.">
  <meta name="keywords" content="rotakip, okuma takibi, okuma grupları, okuma alışkanlığı, tesbihat, tefekkür, videolar, makaleler">
  <meta name="robots" content="index, follow">
  <link id="canonicalLink" rel="canonical" href="https://rotakip.up.railway.app/tesbihat">
  <link rel="icon" href="/images/favicon.webp" type="image/x-icon">
  <title id="page-title">RoTaKip</title>
  <script>
    (() => {
      const path = window.location.pathname.replace(/\/$/, '') || '/';
      const responsiveViewport = 'width=device-width, initial-scale=1, viewport-fit=cover';
      const legacyGroupViewport = 'width=980';
      const legacyViewportWidth = 980;
      const legacyNavigationProperties = [
        '--group-legacy-body-padding',
        '--group-legacy-nav-height',
        '--group-legacy-item-height',
        '--group-legacy-item-gap',
        '--group-legacy-font-size',
        '--group-legacy-icon-size',
        '--group-legacy-radius-x',
        '--group-legacy-radius-y',
        '--group-legacy-feedback-inset',
        '--group-legacy-feedback-radius-x',
        '--group-legacy-bottom-gap',
        '--group-legacy-loader-padding',
        '--group-legacy-loader-max-width',
        '--group-legacy-loader-font-size',
        '--group-legacy-loader-offset',
        '--group-legacy-loader-star-size',
        '--group-legacy-loader-shadow-blur',
        '--group-legacy-loader-lines-gap',
        '--group-legacy-loader-lines-margin',
        '--group-legacy-loader-line-width',
        '--group-legacy-loader-line-height',
        '--group-legacy-loader-line-radius',
        '--group-legacy-loader-text-top',
        '--group-legacy-loader-text-size',
        '--group-legacy-loader-bounce'
      ];
      const syncLegacyNavigationMetrics = enabled => {
        const rootStyle = document.documentElement.style;
        if (!enabled) {
          legacyNavigationProperties.forEach(property => rootStyle.removeProperty(property));
          return;
        }

        const visualViewportWidth = window.visualViewport
          ? window.visualViewport.width * window.visualViewport.scale
          : 0;
        const renderedViewportWidth = visualViewportWidth || window.screen.width || legacyViewportWidth;
        const legacyScale = Math.min(1, Math.max(0.25, renderedViewportWidth / legacyViewportWidth));
        const scaledPixels = value => `${value / legacyScale}px`;
        const responsiveIconSize = Math.min(24, Math.max(20, renderedViewportWidth * 0.058));

        rootStyle.setProperty('--group-legacy-body-padding', scaledPixels(58));
        rootStyle.setProperty('--group-legacy-nav-height', scaledPixels(59));
        rootStyle.setProperty('--group-legacy-item-height', scaledPixels(58));
        rootStyle.setProperty('--group-legacy-item-gap', scaledPixels(4));
        rootStyle.setProperty('--group-legacy-font-size', scaledPixels(11));
        rootStyle.setProperty('--group-legacy-icon-size', scaledPixels(responsiveIconSize));
        rootStyle.setProperty('--group-legacy-radius-x', scaledPixels(16));
        rootStyle.setProperty('--group-legacy-radius-y', scaledPixels(32));
        rootStyle.setProperty('--group-legacy-feedback-inset', scaledPixels(-8));
        rootStyle.setProperty('--group-legacy-feedback-radius-x', scaledPixels(12));
        rootStyle.setProperty('--group-legacy-bottom-gap', scaledPixels(12));
        rootStyle.setProperty('--group-legacy-loader-padding', scaledPixels(20));
        rootStyle.setProperty('--group-legacy-loader-max-width', scaledPixels(195));
        rootStyle.setProperty('--group-legacy-loader-font-size', scaledPixels(14));
        rootStyle.setProperty('--group-legacy-loader-offset', scaledPixels(-6));
        rootStyle.setProperty('--group-legacy-loader-star-size', scaledPixels(30));
        rootStyle.setProperty('--group-legacy-loader-shadow-blur', scaledPixels(12));
        rootStyle.setProperty('--group-legacy-loader-lines-gap', scaledPixels(7));
        rootStyle.setProperty('--group-legacy-loader-lines-margin', scaledPixels(38));
        rootStyle.setProperty('--group-legacy-loader-line-width', scaledPixels(27));
        rootStyle.setProperty('--group-legacy-loader-line-height', scaledPixels(3));
        rootStyle.setProperty('--group-legacy-loader-line-radius', scaledPixels(12));
        rootStyle.setProperty('--group-legacy-loader-text-top', scaledPixels(-19));
        rootStyle.setProperty('--group-legacy-loader-text-size', scaledPixels(16));
        rootStyle.setProperty('--group-legacy-loader-bounce', scaledPixels(-10));
      };
      const syncViewport = pathname => {
        const normalizedPath = String(pathname || '/').replace(/\/$/, '') || '/';
        const usesLegacyGroupLayout = normalizedPath.startsWith('/grup/');
        const viewport = document.querySelector('meta[name="viewport"]');
        syncLegacyNavigationMetrics(usesLegacyGroupLayout);
        document.documentElement.classList.toggle('group-legacy-viewport', usesLegacyGroupLayout);
        if (viewport) viewport.content = usesLegacyGroupLayout ? legacyGroupViewport : responsiveViewport;
      };
      window.syncRoTaKipViewport = syncViewport;
      syncViewport(path);
      const refreshLegacyNavigationMetrics = () => {
        if (document.documentElement.classList.contains('group-legacy-viewport')) {
          syncLegacyNavigationMetrics(true);
        }
      };
      window.addEventListener('resize', refreshLegacyNavigationMetrics);
      window.visualViewport?.addEventListener('resize', refreshLegacyNavigationMetrics);

      const selectedRoute = path === '/gruplar' || path.startsWith('/grup/')
        ? 'okumalar'
        : ({
            '/tesbihat': 'tesbihat',
            '/tefekkur': 'tefekkur',
            '/videolar': 'videos',
            '/makaleler': 'articles'
          })[path];
      if (!selectedRoute) return;

      const markActiveNavigation = () => {
        const navigation = document.getElementById('appNavigation');
        if (!navigation) return false;
        const activeLink = navigation.querySelector(`[data-route="${selectedRoute}"]`);
        if (!activeLink) return false;
        activeLink.classList.add('is-active');
        activeLink.setAttribute('aria-current', 'page');
        navigation.dataset.activeRoute = selectedRoute;
        return true;
      };

      const navigationObserver = new MutationObserver(() => {
        if (markActiveNavigation()) navigationObserver.disconnect();
      });
      navigationObserver.observe(document.documentElement, { childList: true, subtree: true });
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="/shell.min.css?v=19d960ea8328">
</head>
<body class="app-shell-body initial-tab-loading">
  <div class="groups-sparkle-overlay" aria-hidden="true"></div>

  <div id="cookieConsentBanner" class="cookie-consent-banner">
    <div class="cookie-content">
      <div class="cookie-header">
        <div class="cookie-icon">🍪</div>
        <h3>Çerez İzni</h3>
      </div>
      <p>Bu site, size en iyi deneyimi sunmak için çerezleri kullanmaktadır. Çerezler, tercihlerinizi hatırlamak ve site kullanımınızı analiz etmek için kullanılır.</p>
      <div class="cookie-buttons">
        <button id="declineCookies" class="cookie-button decline" type="button">Reddet</button>
        <button id="acceptCookies" class="cookie-button accept cookie-pulsate-button" type="button">Kabul Et</button>
      </div>
    </div>
  </div>

  <nav id="appNavigation" class="app-navigation" aria-label="RoTaKip bölümleri">
    <div class="app-navigation-items">
      <a class="app-navigation-item" data-route="tesbihat" href="/tesbihat">
        <span class="app-navigation-icon" aria-hidden="true"><i class="fa-regular fa-moon app-navigation-icon-outline"></i><i class="fa-solid fa-moon app-navigation-icon-filled"></i></span><span>Tesbihat</span>
      </a>
      <a class="app-navigation-item" data-route="tefekkur" href="/tefekkur">
        <span class="app-navigation-icon" aria-hidden="true"><i class="fa-regular fa-star app-navigation-icon-outline"></i><i class="fa-solid fa-star app-navigation-icon-filled"></i></span><span>Tefekkür</span>
      </a>
      <a class="app-navigation-item" data-route="videos" href="/videolar">
        <span class="app-navigation-icon" aria-hidden="true"><i class="fa-regular fa-circle-play app-navigation-icon-outline"></i><i class="fa-solid fa-circle-play app-navigation-icon-filled"></i></span><span>Videolar</span>
      </a>
      <a class="app-navigation-item" data-route="articles" href="/makaleler">
        <span class="app-navigation-icon" aria-hidden="true"><i class="fa-regular fa-newspaper app-navigation-icon-outline"></i><i class="fa-solid fa-newspaper app-navigation-icon-filled"></i></span><span>Makaleler</span>
      </a>
      <a class="app-navigation-item" data-route="okumalar" href="/gruplar">
        <span class="app-navigation-icon" aria-hidden="true"><i class="fa-regular fa-compass app-navigation-icon-outline"></i><i class="fa-solid fa-compass app-navigation-icon-filled"></i></span><span>Okumalar</span>
      </a>
    </div>
  </nav>

  <div class="main-container app-shell-container">
    <main id="tabContent" class="tab-content is-initial-loading" tabindex="-1">
      <div id="initialTabLoader" class="initial-tab-loader" role="status" aria-label="İlk sekme hazırlanıyor">
        <div class="route-loader" aria-hidden="true">
          <div class="route-loader-star">⭐</div>
          <div class="route-loader-lines">
            <div class="route-loader-line"><span>Ro</span></div>
            <div class="route-loader-line"><span>Ta</span></div>
            <div class="route-loader-line"><span>Kip</span></div>
          </div>
        </div>
      </div>
    </main>
    <div id="footerRoot" hidden></div>
  </div>
  <div id="globalOverlayRoot"></div>
  <div id="overlayRoot"></div>
  <button id="scrollToTopBtn" class="scroll-to-top-btn hidden" type="button" title="Yukarı Çık" aria-label="Yukarı çık" hidden>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M12 2L2 12H8V22H16V12H22L12 2Z" fill="currentColor" />
    </svg>
  </button>

  <noscript>RoTaKip bölümlerini görüntülemek için JavaScript'i etkinleştirin.</noscript>
  <script type="module" src="/app/shell-router.js"></script>
</body>
</html>
