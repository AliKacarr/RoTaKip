<div class="articles">

      </label>

      <li><button type="button" class="articles-category-card" data-category="Ahiretin Varlığının Delilleri" data-slug="ahiretin-varliginin-delilleri"><span class="articles-category-name">Ahiretin Varlığının Delilleri</span><i class="fa-solid fa-chevron-right articles-category-chevron" aria-hidden="true"></i></button></li>
      <li><button type="button" class="articles-category-card" data-category="Kâinat Rehberi" data-slug="kainat-rehberi"><span class="articles-category-name">Kâinat Rehberi</span><i class="fa-solid fa-chevron-right articles-category-chevron" aria-hidden="true"></i></button></li>

      <button type="button" class="articles-back" data-back aria-label="Kategorilere dön"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
      <div class="articles-category-heading">
        <h2 id="articlesCategoryTitle" class="articles-category-title"></h2>
        <p id="articlesCategoryCount" class="articles-category-count" hidden></p>
      </div>
