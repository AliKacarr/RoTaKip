<div class="quote">
  <h3><i class="fa-solid fa-star-and-crescent"
      style="font-size: 1.4em !important; padding: 0 10px 0 5px;"></i> Rahmet Penceresi
  </h3>
  <div class="quote-grid-container">
    <div class="quote-section is-loading">
      <button class="refresh-quote" id="refreshAyat" title="Yeni ayet getir" disabled><i
          class="fa-solid fa-arrow-rotate-right"></i></button>
      <button class="share-quote" data-target="ayatText" title="Paylaş" disabled>
        <img src="/images/share.webp" alt="Paylaş" style="width: 24px; height: 24px;">
      </button>
      <div class="quote-container">
        <div class="quote-icon">
          <img src="/images/ayat-icon.webp" alt="Ayet İkonu" loading="lazy">
          <div class="quote-title">BİR AYET</div>
        </div>
        <div id="ayatText" class="quote-text is-loading" aria-busy="true" aria-label="Ayet yükleniyor">
          <div class="quote-loading-placeholder" aria-hidden="true">
            <span class="quote-loading-line"></span><span class="quote-loading-line"></span><span class="quote-loading-line"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="quote-section is-loading">
      <button class="refresh-quote" id="refreshHadith" title="Yeni hadis getir" disabled><i
          class="fa-solid fa-arrow-rotate-right"></i></button>
      <button class="share-quote" data-target="hadithText" title="Paylaş" disabled>
        <img src="/images/share.webp" alt="Paylaş" style="width: 24px; height: 24px;">
      </button>
      <div class="quote-container">
        <div class="quote-icon">
          <img src="/images/hadith-icon.webp" alt="Hadis İkonu" loading="lazy">
          <div class="quote-title">BİR HADİS</div>
        </div>
        <div id="hadithText" class="quote-text is-loading" aria-busy="true" aria-label="Hadis yükleniyor">
          <div class="quote-loading-placeholder" aria-hidden="true">
            <span class="quote-loading-line"></span><span class="quote-loading-line"></span><span class="quote-loading-line"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="quote-section is-loading">
      <button class="refresh-quote" id="refreshDua" title="Yeni dua getir" disabled><i
          class="fa-solid fa-arrow-rotate-right"></i></button>
      <button class="share-quote" data-target="duaText" title="Paylaş" disabled>
        <img src="/images/share.webp" alt="Paylaş" style="width: 24px; height: 24px;">
      </button>
      <div class="quote-container">
        <div class="quote-icon">
          <img src="/images/dua-icon.webp" alt="Dua İkonu" loading="lazy">
          <div class="quote-title">BİR DUA</div>
        </div>
        <div id="duaText" class="quote-text is-loading" aria-busy="true" aria-label="Dua yükleniyor">
          <div class="quote-loading-placeholder" aria-hidden="true">
            <span class="quote-loading-line"></span><span class="quote-loading-line"></span><span class="quote-loading-line"></span>
          </div>
        </div>
      </div>
    </div>

    <div class="quote-section is-loading">
      <button class="refresh-quote" id="refreshQuote" title="Yeni söz getir" disabled><i
          class="fa-solid fa-arrow-rotate-right"></i></button>
      <button class="share-quote" data-target="quoteText" title="Paylaş" disabled>
        <img src="/images/share.webp" alt="Paylaş" style="width: 24px; height: 24px;">
      </button>
      <div class="quote-container">
        <div class="quote-icon">
          <img src="/images/lamba.webp" alt="Fikir Lambası" loading="lazy">
          <div class="quote-title">BİR SÖZ</div>
        </div>
        <div id="quoteText" class="quote-text is-loading" aria-busy="true" aria-label="Söz yükleniyor">
          <div class="quote-loading-placeholder" aria-hidden="true">
            <span class="quote-loading-line"></span><span class="quote-loading-line"></span><span class="quote-loading-line"></span>
          </div>
        </div>
      </div>

</div>
