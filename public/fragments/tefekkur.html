<div class="tefekkur-page">
  <section class="tefekkur-view" data-view="home" aria-label="Tefekkür bölümleri">
    <div id="tefekkurNowPlaying" class="tefekkur-now-playing" hidden>
      <button type="button" class="tefekkur-now-playing-open" data-open-radio>
        <span class="tefekkur-now-playing-eq" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="tefekkur-now-playing-text">
          <strong id="tefekkurNowPlayingName">Radyo</strong>
          <small id="tefekkurNowPlayingStatus">Canlı yayında</small>
        </span>
      </button>
      <button type="button" id="tefekkurNowPlayingToggle" class="tefekkur-now-playing-button" aria-label="Duraklat"><i class="fa-solid fa-pause" aria-hidden="true"></i></button>
      <button type="button" id="tefekkurNowPlayingStop" class="tefekkur-now-playing-button" aria-label="Radyoyu kapat"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    </div>

    <ul class="tefekkur-section-list">
      <li><button type="button" class="tefekkur-section-row" data-section="ayet">
        <span class="tefekkur-section-icon"><i class="fa-solid fa-book-quran" aria-hidden="true"></i></span>
        <span class="tefekkur-section-name">Ayet<small>Kur'ân-ı Kerîm'den ayetler</small></span>
        <i class="fa-solid fa-chevron-right tefekkur-section-chevron" aria-hidden="true"></i>
      </button></li>
      <li><button type="button" class="tefekkur-section-row" data-section="hadis">
        <span class="tefekkur-section-icon"><i class="fa-solid fa-scroll" aria-hidden="true"></i></span>
        <span class="tefekkur-section-name">Hadis<small>Peygamber Efendimizin (a.s.m.) sözleri</small></span>
        <i class="fa-solid fa-chevron-right tefekkur-section-chevron" aria-hidden="true"></i>
      </button></li>
      <li><button type="button" class="tefekkur-section-row" data-section="dua">
        <span class="tefekkur-section-icon"><i class="fa-solid fa-hands-praying" aria-hidden="true"></i></span>
        <span class="tefekkur-section-name">Dua<small>Kalbe huzur veren dualar</small></span>
        <i class="fa-solid fa-chevron-right tefekkur-section-chevron" aria-hidden="true"></i>
      </button></li>
      <li><button type="button" class="tefekkur-section-row" data-section="risale">
        <span class="tefekkur-section-icon"><i class="fa-solid fa-book-open" aria-hidden="true"></i></span>
        <span class="tefekkur-section-name">Risale-i Nur<small>Metin ya da görsel olarak</small></span>
        <i class="fa-solid fa-chevron-right tefekkur-section-chevron" aria-hidden="true"></i>
      </button></li>
      <li><button type="button" class="tefekkur-section-row" data-section="esma">
        <span class="tefekkur-section-icon"><i class="fa-solid fa-star-and-crescent" aria-hidden="true"></i></span>
        <span class="tefekkur-section-name">Esmaül Hüsna<small>Allah'ın (c.c.) 99 güzel ismi</small></span>
        <i class="fa-solid fa-chevron-right tefekkur-section-chevron" aria-hidden="true"></i>
      </button></li>
      <li><button type="button" class="tefekkur-section-row" data-section="ilahi">
        <span class="tefekkur-section-icon"><i class="fa-solid fa-music" aria-hidden="true"></i></span>
        <span class="tefekkur-section-name">İlahiler<small>Huzur veren ilahiler</small></span>
        <i class="fa-solid fa-chevron-right tefekkur-section-chevron" aria-hidden="true"></i>
      </button></li>
      <li><button type="button" class="tefekkur-section-row" data-section="kuran-radyo">
        <span class="tefekkur-section-icon"><i class="fa-solid fa-tower-broadcast" aria-hidden="true"></i></span>
        <span class="tefekkur-section-name">Kur'an Radyo<small>Canlı yayın</small></span>
        <i class="fa-solid fa-chevron-right tefekkur-section-chevron" aria-hidden="true"></i>
      </button></li>
      <li><button type="button" class="tefekkur-section-row" data-section="risalet-radyo">
        <span class="tefekkur-section-icon"><i class="fa-solid fa-radio" aria-hidden="true"></i></span>
        <span class="tefekkur-section-name">Risalet Radyo<small>Canlı yayın</small></span>
        <i class="fa-solid fa-chevron-right tefekkur-section-chevron" aria-hidden="true"></i>
      </button></li>
      <li><button type="button" class="tefekkur-section-row" data-section="zikirmatik">
        <span class="tefekkur-section-icon"><i class="fa-solid fa-bullseye" aria-hidden="true"></i></span>
        <span class="tefekkur-section-name">Zikirmatik<small>Günlük zikirlerinizi çekin</small></span>
        <i class="fa-solid fa-chevron-right tefekkur-section-chevron" aria-hidden="true"></i>
      </button></li>
      <li><button type="button" class="tefekkur-section-row" data-section="kaydedilenler">
        <span class="tefekkur-section-icon"><i class="fa-solid fa-star" aria-hidden="true"></i></span>
        <span class="tefekkur-section-name">Kaydedilenler<small>Beğendiğin içerikler</small></span>
        <i class="fa-solid fa-chevron-right tefekkur-section-chevron" aria-hidden="true"></i>
      </button></li>
    </ul>
  </section>

  <section class="tefekkur-view" data-view="slider" aria-labelledby="tefekkurSliderTitle" hidden>
    <header class="tefekkur-slider-bar">
      <button type="button" class="tefekkur-slider-back" data-back aria-label="Geri dön"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></button>
      <h4 id="tefekkurSliderTitle">Tefekkür</h4>
      <button type="button" id="tefekkurSliderSave" class="tefekkur-slider-save" aria-pressed="false" aria-label="Kaydet" title="Kaydet" disabled><i class="fa-regular fa-star is-base" aria-hidden="true"></i><i class="fa-solid fa-star is-fill" aria-hidden="true"></i></button>
      <div id="tefekkurSliderModes" class="tefekkur-slider-modes" role="group" aria-label="Okuma biçimi" hidden></div>
      <button type="button" id="tefekkurSliderChip" class="tefekkur-slider-chip" hidden>
        <i class="fa-solid fa-shuffle" aria-hidden="true"></i>
        <span>Rastgele</span>
      </button>
    </header>

    <div id="tefekkurSliderStage" class="tefekkur-slider-stage" role="region" aria-roledescription="kaydırmalı içerik" aria-labelledby="tefekkurSliderTitle">
      <article id="tefekkurSlide" class="tefekkur-slide" aria-live="polite"></article>
    </div>

    <div class="tefekkur-slider-controls">
      <div class="tefekkur-slider-nav">
        <button type="button" id="tefekkurSliderPrev" class="tefekkur-slider-step" aria-label="Önceki"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
        <span id="tefekkurSliderCounter" class="tefekkur-slider-counter" aria-live="polite"></span>
        <button type="button" id="tefekkurSliderNext" class="tefekkur-slider-step" aria-label="Sonraki"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
      </div>
      <div class="tefekkur-slider-actions">
        <button type="button" id="tefekkurSliderCopy" class="tefekkur-slider-action is-outline"><i class="fa-regular fa-copy" aria-hidden="true"></i><span>Kopyala</span></button>
        <button type="button" id="tefekkurSliderShare" class="tefekkur-slider-action is-solid"><i class="fa-solid fa-share-nodes" aria-hidden="true"></i><span>Paylaş</span></button>
      </div>
    </div>
  </section>

  <section class="tefekkur-view" data-view="zikirmatik" aria-labelledby="tefekkurZikirTitle" hidden>
    <header class="tefekkur-plain-header">
      <button type="button" class="tefekkur-back" data-back aria-label="Tefekkür bölümlerine dön"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></button>
      <div class="tefekkur-plain-header-titles">
        <h4 id="tefekkurZikirTitle">Zikirmatik</h4>
        <p id="tefekkurZikirSubtitle">Serbest zikir</p>
      </div>
      <div class="tefekkur-header-actions" role="group" aria-label="Zikirmatik ayarları">
        <button type="button" id="tefekkurZikirVibration" aria-pressed="true" aria-label="Titreşim" title="Titreşim" hidden><i class="fa-solid fa-mobile-screen-button" aria-hidden="true"></i></button>
        <button type="button" id="tefekkurZikirClear" aria-label="Tümünü sil" title="Tümünü sil"><i class="fa-solid fa-trash-can" aria-hidden="true"></i></button>
        <button type="button" id="tefekkurZikirReset" aria-label="Sayacı sıfırla" title="Sayacı sıfırla"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i></button>
      </div>
    </header>

    <div class="tefekkur-zikir-presets" role="group" aria-label="Zikir seçimi"></div>

    <div class="tefekkur-zikir-targets" role="group" aria-label="Tur hedefi">
      <button type="button" data-target="33">33</button>
      <button type="button" data-target="99">99</button>
      <button type="button" data-target="100">100</button>
      <button type="button" data-target="500">500</button>
      <button type="button" data-target="1000">1000</button>
      <button type="button" data-target="0" aria-label="Hedefsiz">∞</button>
    </div>

    <div class="tefekkur-zikir-card">
      <p id="tefekkurZikirArabic" class="tefekkur-zikir-arabic" lang="ar" dir="rtl" hidden></p>
      <button type="button" id="tefekkurZikirTap" class="tefekkur-zikir-ring">
        <svg viewBox="0 0 120 120" aria-hidden="true" focusable="false">
          <circle class="tefekkur-zikir-ring-track" cx="60" cy="60" r="54" />
          <circle class="tefekkur-zikir-ring-progress" cx="60" cy="60" r="54" pathLength="100" stroke-dasharray="0 100" />
        </svg>
        <span class="tefekkur-zikir-ring-inner">
          <strong id="tefekkurZikirCount">0</strong>
          <small id="tefekkurZikirTarget">/ 33</small>
        </span>
      </button>
      <p class="tefekkur-zikir-hint">Zikir için ekrana dokunun</p>
      <dl class="tefekkur-zikir-stats">
        <div><dt>Tur</dt><dd id="tefekkurZikirLaps">0</dd></div>
        <div><dt>Toplam</dt><dd id="tefekkurZikirTotal">0</dd></div>
      </dl>
    </div>
  </section>

  <section class="tefekkur-view" data-view="radio" aria-labelledby="tefekkurRadioTitle" hidden>
    <header class="tefekkur-plain-header">
      <button type="button" class="tefekkur-back" data-back aria-label="Tefekkür bölümlerine dön"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></button>
      <div class="tefekkur-plain-header-titles">
        <h4 id="tefekkurRadioTitle">Radyo</h4>
        <p>Canlı yayın</p>
      </div>
    </header>

    <div id="tefekkurRadioCard" class="tefekkur-radio-card" data-state="idle">
      <div class="tefekkur-radio-art">
        <i id="tefekkurRadioIcon" class="fa-solid fa-tower-broadcast" aria-hidden="true"></i>
        <span class="tefekkur-radio-live">CANLI</span>
      </div>
      <div class="tefekkur-radio-eq" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <h5 id="tefekkurRadioName">Radyo</h5>
      <button type="button" id="tefekkurRadioPlay" class="tefekkur-radio-play" aria-label="Dinle">
        <i class="fa-solid fa-play" aria-hidden="true"></i>
        <span class="tefekkur-radio-spinner" aria-hidden="true"></span>
      </button>
      <p id="tefekkurRadioStatus" class="tefekkur-radio-status" role="status" aria-live="polite" hidden></p>
      <label class="tefekkur-radio-volume" id="tefekkurRadioVolumeRow">
        <i class="fa-solid fa-volume-low" aria-hidden="true"></i>
        <input type="range" id="tefekkurRadioVolume" min="0" max="1" step="0.05" value="1" aria-label="Ses düzeyi">
        <i class="fa-solid fa-volume-high" aria-hidden="true"></i>
      </label>
    </div>

    <aside class="tefekkur-info-note">
      <span class="tefekkur-info-icon" aria-hidden="true"><i class="fa-solid fa-info"></i></span>
      <p>Yayın, bu sayfadan ayrılsanız da çalmaya devam eder. Tefekkür ana sayfasındaki çalar çubuğundan durdurabilirsiniz.</p>
    </aside>
  </section>

  <section class="tefekkur-view" data-view="ilahi" aria-labelledby="tefekkurIlahiTitle" hidden>
    <header class="tefekkur-slider-bar">
      <button type="button" class="tefekkur-slider-back" data-back aria-label="Geri dön"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></button>
      <h4 id="tefekkurIlahiTitle">İlahiler</h4>
      <button type="button" id="tefekkurIlahiMenu" class="tefekkur-ilahi-menu-open" aria-label="Seçenekler" title="Seçenekler" aria-haspopup="dialog"><i class="fa-solid fa-ellipsis" aria-hidden="true"></i></button>
    </header>

    <div class="tefekkur-ilahi-deck">
      <div id="tefekkurIlahiSlot" class="tefekkur-ilahi-slot"></div>
      <div class="tefekkur-ilahi-info" aria-live="polite">
        <h5 id="tefekkurIlahiTrackTitle"></h5>
        <p id="tefekkurIlahiTrackChannel"></p>
      </div>
      <div class="tefekkur-ilahi-actions">
        <div class="tefekkur-ilahi-reactions" role="group" aria-label="İlahiyi değerlendir">
          <button type="button" id="tefekkurIlahiLike" aria-label="Beğendim" title="Beğendim" aria-pressed="false"><i class="fa-regular fa-thumbs-up" aria-hidden="true"></i></button>
          <button type="button" id="tefekkurIlahiDislike" aria-label="Beğenmedim" title="Beğenmedim" aria-pressed="false"><i class="fa-regular fa-thumbs-down" aria-hidden="true"></i></button>
          <button type="button" id="tefekkurIlahiShare" aria-label="Paylaş" title="Paylaş"><i class="fa-solid fa-share" aria-hidden="true"></i></button>
        </div>
        <div class="tefekkur-ilahi-transport" role="group" aria-label="Oynatma kontrolleri">
          <button type="button" id="tefekkurIlahiPrev" aria-label="Önceki"><i class="fa-solid fa-backward-step" aria-hidden="true"></i></button>
          <button type="button" id="tefekkurIlahiToggle" class="is-main" aria-label="Oynat"><i class="fa-solid fa-play" aria-hidden="true"></i></button>
          <button type="button" id="tefekkurIlahiNext" aria-label="Sonraki"><i class="fa-solid fa-forward-step" aria-hidden="true"></i></button>
        </div>
      </div>
    </div>

    <div class="tefekkur-ilahi-tabs" role="group" aria-label="İlahi listeleri">
      <button type="button" data-list="queue" aria-pressed="true">Sıradaki</button>
      <button type="button" data-list="liked" aria-pressed="false"><i class="fa-regular fa-thumbs-up" aria-hidden="true"></i>Beğendiklerim<span data-count></span></button>
      <button type="button" data-list="disliked" aria-pressed="false"><i class="fa-regular fa-thumbs-down" aria-hidden="true"></i>Beğenmediklerim<span data-count></span></button>
    </div>

    <ul id="tefekkurIlahiList" class="tefekkur-ilahi-list"></ul>
  </section>
</div>
