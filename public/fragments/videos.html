<div class="videos">
      <div class="top-bar" role="group" aria-label="Video sıralama seçenekleri">
        <button id="randomBtn" type="button">
          <i class="fa-solid fa-shuffle"></i> Rastgele
        </button>
        <button id="latestBtn" type="button">
          <i class="fa-solid fa-forward-fast"></i> Son Yüklenen
        </button>
        <button id="mostViewedBtn" type="button">
          <i class="fa-solid fa-chart-line"></i> Popüler
        </button>
        <button id="refreshBtn" type="button">
          <i class="fa-solid fa-rotate"></i> Yenile
        </button>
      </div>
      <div id="videos" class="videos-container" style="position: relative;"></div>

      <div id="videoModal" class="video-modal">
        <div class="modal-content-video">
          <button type="button" class="close" aria-label="Videoyu kapat">&times;</button>
          <iframe id="videoFrame" title="Video oynatıcı" frameborder="0" allowfullscreen loading="lazy"></iframe>
        </div>
      </div>
    </div>
